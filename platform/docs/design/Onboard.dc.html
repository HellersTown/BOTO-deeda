<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before you set out</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;family=Zilla+Slab:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:#F3EEE3;color:#1E1B16}
a{color:#8C3514}a:hover{color:#6E2A10}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EEE3">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 0 24px">
    <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: #5A5346">Before you set out</span>
    <a href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: 14px; font-weight: 600; color: #5A5346; text-decoration: none">Skip</a>
  </header>

  <form style="flex-grow: 1; padding: 6px 24px 0 24px; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="home" style="font-family: 'Zilla Slab', Rockwell, Georgia, serif; font-size: 28px; font-weight: 700; line-height: 1.1">Where do you set out from?</label>
      <input id="home" inputmode="numeric" autocomplete="postal-code" value="53202" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #1E1B16; border-radius: 12px; background: #FFFDF8; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 600">
      <span style="font-size: 13px; color: #5A5346">Your ZIP code. Every distance and pickup trip starts here.</span>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0; margin-bottom: 10px; font-family: 'Zilla Slab', Rockwell, Georgia, serif; font-size: 22px; font-weight: 700">How far will you travel for the right thing?</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 12px; border: 1.5px solid #D6CBB5; background: #FFFDF8; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600"><input type="radio" name="radius" style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">25 mi</label>
        <label style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 12px; border: 2px solid #24402E; background: #E4ECE5; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600"><input type="radio" name="radius" checked style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">60 mi</label>
        <label style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 12px; border: 1.5px solid #D6CBB5; background: #FFFDF8; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600"><input type="radio" name="radius" style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">100 mi</label>
        <label style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 12px; border: 1.5px solid #D6CBB5; background: #FFFDF8; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600"><input type="radio" name="radius" style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">200 mi</label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0; margin-bottom: 10px; font-family: 'Zilla Slab', Rockwell, Georgia, serif; font-size: 22px; font-weight: 700">What are you gathering?</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid #24402E; background: #E4ECE5; font-size: 14px; font-weight: 600"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">Tools</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid #24402E; background: #E4ECE5; font-size: 14px; font-weight: 600"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">Generators and power</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid #24402E; background: #E4ECE5; font-size: 14px; font-weight: 600"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">Woodstoves and heat</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid #D6CBB5; background: #FFFDF8; font-size: 14px; font-weight: 600"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">Canning and kitchen</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid #D6CBB5; background: #FFFDF8; font-size: 14px; font-weight: 600"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">Fencing and livestock</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid #D6CBB5; background: #FFFDF8; font-size: 14px; font-weight: 600"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">Tractors and implements</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid #D6CBB5; background: #FFFDF8; font-size: 14px; font-weight: 600"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">Trucks and trailers</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid #D6CBB5; background: #FFFDF8; font-size: 14px; font-weight: 600"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #24402E">Household</label>
      </div>
      <span style="font-size: 13px; color: #5A5346">Each one you pick becomes a hunt. Change them any time.</span>
    </fieldset>
  </form>

  <div style="padding: 14px 24px 28px 24px">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">Start watching</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B3431B","options":["#B3431B","#24402E","#1F4E79"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B3431B' };
  }
}
</script>
</body>
</html>

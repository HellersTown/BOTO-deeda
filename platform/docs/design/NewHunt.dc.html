<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New hunt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:#F6F3EC;color:#1D1B16}
a{color:#9A3412}a:hover{color:#7C2D12}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 4px 20px">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">New hunt</h1>
    <a href="Hunts.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1D1B16">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </header>

  <form style="flex-grow: 1; padding: 8px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="describe" style="font-size: 14px; font-weight: 600">Describe it the way you would to a friend</label>
      <textarea id="describe" rows="3" style="box-sizing: border-box; padding: 12px 14px; border: 1.5px solid #1D1B16; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 16px; line-height: 1.4; resize: none">DJI drone with thermal under $1,500 within 50 miles of 53202</textarea>
    </div>

    <section aria-labelledby="readas" style="padding: 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E2DDD0; display: flex; flex-direction: column; gap: 10px">
      <h2 id="readas" style="margin: 0; font-size: 14px; font-weight: 700">I read this as</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-label="Remove brand DJI" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D9D2C3; border-radius: 18px; background: #F6F3EC; font: inherit; font-size: 13px; color: #1D1B16"><span style="color: #5E5A50">Brand</span> DJI <span aria-hidden="true">×</span></button>
        <button type="button" aria-label="Remove category Drones" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D9D2C3; border-radius: 18px; background: #F6F3EC; font: inherit; font-size: 13px; color: #1D1B16"><span style="color: #5E5A50">Category</span> Drones <span aria-hidden="true">×</span></button>
        <button type="button" aria-label="Remove feature thermal" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D9D2C3; border-radius: 18px; background: #F6F3EC; font: inherit; font-size: 13px; color: #1D1B16"><span style="color: #5E5A50">Must have</span> thermal <span aria-hidden="true">×</span></button>
        <button type="button" aria-label="Remove maximum price" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D9D2C3; border-radius: 18px; background: #F6F3EC; font: inherit; font-size: 13px; color: #1D1B16"><span style="color: #5E5A50">Up to</span> $1,500 <span aria-hidden="true">×</span></button>
        <button type="button" aria-label="Change distance" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D9D2C3; border-radius: 18px; background: #F6F3EC; font: inherit; font-size: 13px; color: #1D1B16"><span style="color: #5E5A50">Within</span> 50 mi of 53202</button>
      </div>
      <p style="margin: 0; font-size: 13px; color: #5E5A50">Also searching for: quadcopter, UAV. Lots that ship are included.</p>
    </section>

    <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border: 1.5px dashed #BDB4A2; border-radius: 14px; background: transparent; font: inherit; text-align: left; color: #1D1B16">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Add a photo</span><span style="font-size: 12px; color: #5E5A50">Pro: also match lots that look like it</span></span>
    </button>

    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px">
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Alert me when a match is listed</span><span style="font-size: 12px; color: #5E5A50">Free plan: within the hour. Pro: within a minute.</span></span>
      <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #C2410C">
    </label>
  </form>

  <div style="padding: 12px 20px 24px 20px; display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; font-size: 13px; color: #5E5A50; text-align: center">This will be hunt 2 of 3 on the Free plan.</p>
    <a href="Hunts.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">Start hunting</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1F4D3A","#1D4ED8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C2410C' };
  }
}
</script>
</body>
</html>

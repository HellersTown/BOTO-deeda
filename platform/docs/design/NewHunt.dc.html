<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New hunt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;family=Zilla+Slab:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:#F3EEE3;color:#1E1B16}
a{color:#8C3514}a:hover{color:#6E2A10}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EEE3">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 4px 20px">
    <h1 style="margin: 0; font-family: 'Zilla Slab', Rockwell, Georgia, serif; font-size: 28px; font-weight: 700">New hunt</h1>
    <a href="Hunts.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1E1B16">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </header>

  <form style="flex-grow: 1; padding: 8px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="describe" style="font-size: 14px; font-weight: 700">What do you need? Say it the way you would tell a friend.</label>
      <textarea id="describe" rows="3" style="box-sizing: border-box; padding: 12px 14px; border: 1.5px solid #1E1B16; border-radius: 12px; background: #FFFDF8; font: inherit; font-size: 16px; line-height: 1.4; resize: none">Pressure canner, All American or Presto, under $150 within 60 miles</textarea>
    </div>

    <section aria-labelledby="readas" style="padding: 14px; border-radius: 14px; background: #FFFDF8; border: 1px solid #D6CBB5; display: flex; flex-direction: column; gap: 10px">
      <h2 id="readas" style="margin: 0; font-size: 14px; font-weight: 700">Read as</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-label="Remove brand All American" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D6CBB5; border-radius: 18px; background: #F3EEE3; font: inherit; font-size: 13px; color: #1E1B16"><span style="color: #5A5346">Brand</span> All American <span aria-hidden="true">×</span></button>
        <button type="button" aria-label="Remove brand Presto" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D6CBB5; border-radius: 18px; background: #F3EEE3; font: inherit; font-size: 13px; color: #1E1B16"><span style="color: #5A5346">Brand</span> Presto <span aria-hidden="true">×</span></button>
        <button type="button" aria-label="Remove item pressure canner" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D6CBB5; border-radius: 18px; background: #F3EEE3; font: inherit; font-size: 13px; color: #1E1B16"><span style="color: #5A5346">Item</span> pressure canner <span aria-hidden="true">×</span></button>
        <button type="button" aria-label="Remove maximum price" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D6CBB5; border-radius: 18px; background: #F3EEE3; font: inherit; font-size: 13px; color: #1E1B16"><span style="color: #5A5346">Up to</span> $150 <span aria-hidden="true">×</span></button>
        <button type="button" aria-label="Change distance" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 1px solid #D6CBB5; border-radius: 18px; background: #F3EEE3; font: inherit; font-size: 13px; color: #1E1B16"><span style="color: #5A5346">Within</span> 60 mi of 53202</button>
      </div>
      <p style="margin: 0; font-size: 13px; color: #5A5346">Also looking for: canner, pressure cooker. Lots that ship are included.</p>
    </section>

    <button type="button" disabled style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border: 1.5px dashed #BFB199; border-radius: 14px; background: transparent; font: inherit; text-align: left; color: #1E1B16">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M8 6l1.5-2h5L16 6"></path></svg>
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Add a photo</span><span style="font-size: 12px; color: #5A5346">Outfitter: also match lots that look like it</span></span>
    </button>

    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px">
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Tell me when one is listed</span><span style="font-size: 12px; color: #5A5346">Traveler: within the hour. Outfitter: within a minute.</span></span>
      <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #24402E">
    </label>
  </form>

  <div style="padding: 12px 20px 24px 20px; display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; font-size: 13px; color: #5A5346; text-align: center">This will be hunt 3 of 3 on Traveler.</p>
    <a href="Hunts.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">Start watching</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B3431B","options":["#B3431B","#24402E","#1F4E79"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#B3431B' };
  }
}
</script>
</body>
</html>
